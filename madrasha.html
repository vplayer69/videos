<!DOCTYPE html>
<html lang="en">
<head>

<title>Madrasah Management</title>
<style>
:root{--primary:#2457d6;--primary2:#3977f6;--ink:#17233c;--muted:#71809b;--bg:#f4f7fc;--line:#e7edf6;--green:#159b68;--red:#e14e5b;--amber:#e49a24;--white:#fff;--shadow:0 8px 28px rgba(30,55,100,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:17px}.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#6b9bff);color:#fff;display:grid;place-items:center;font-size:20px}.top-right{display:flex;align-items:center;gap:10px}.class-pill{background:#edf3ff;color:var(--primary);padding:8px 12px;border-radius:20px;font-weight:700;font-size:12px}.icon-btn{width:38px;height:38px;border-radius:11px;background:#f3f6fb;color:var(--ink);font-size:18px}.layout{display:flex;max-width:1400px;margin:auto}.sidebar{width:245px;padding:22px 14px;flex-shrink:0}.side-label{font-size:10px;color:#9aa6ba;font-weight:800;letter-spacing:1.2px;padding:12px 12px 8px}.nav-btn{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:transparent;color:#66748d;text-align:left;font-weight:650;margin:3px 0;font-size:13px}.nav-btn span:first-child{font-size:18px;width:22px;text-align:center}.nav-btn.active,.nav-btn:hover{background:#eaf1ff;color:var(--primary)}.main{min-width:0;flex:1;padding:26px 28px 50px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}.page-head h1{font-size:24px;margin:0 0 6px;letter-spacing:-.5px}.sub{color:var(--muted);font-size:13px;margin:0}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:var(--shadow)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{padding:17px;background:#fff;border:1px solid var(--line);border-radius:15px}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:25px;font-weight:800;margin-top:8px}.stat .hint{font-size:11px;color:#9aa6ba;margin-top:4px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;min-width:0}.field label{font-size:12px;font-weight:700;color:#596781}.input,select,textarea{width:100%;border:1px solid #dfe6f1;background:#fff;border-radius:10px;padding:11px 12px;color:var(--ink);outline:none;font-size:13px}.input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #2457d61a}textarea{min-height:105px;resize:vertical}.search{max-width:300px}.btn{padding:10px 14px;border-radius:10px;font-weight:750;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#1948bc}.btn-soft{background:#edf3ff;color:var(--primary)}.btn-outline{background:#fff;border:1px solid var(--line);color:#52617a}.btn-danger{background:#fff0f1;color:var(--red)}.btn-success{background:#e8f8f1;color:var(--green)}.btn:disabled{opacity:.45;cursor:not-allowed}.student-list{display:grid;gap:9px}.student-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}.avatar{width:43px;height:43px;border-radius:13px;background:#eaf1ff;color:var(--primary);display:grid;place-items:center;font-weight:800;flex-shrink:0;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.student-info{flex:1;min-width:0}.student-info strong{font-size:13px;display:block}.student-info small{font-size:11px;color:var(--muted)}.row-actions{display:flex;gap:7px;align-items:center}.mini{padding:8px 10px;border-radius:9px;font-size:11px;font-weight:750}.badge{display:inline-flex;padding:6px 9px;border-radius:20px;font-size:10px;font-weight:800}.paid,.present{background:#e6f7ef;color:var(--green)}.unpaid,.absent{background:#fff0f1;color:var(--red)}.pending{background:#fff5df;color:#b77a13}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:15px}.form-card{max-width:560px}.profile-top{display:flex;align-items:center;gap:16px;margin-bottom:20px}.profile-top .avatar{width:76px;height:76px;border-radius:20px;font-size:23px}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail{padding:13px;background:#f7f9fd;border-radius:11px}.detail small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.detail strong{font-size:13px}.notice{padding:11px 13px;border-radius:10px;font-size:12px;margin:10px 0}.notice.info{background:#edf3ff;color:#2855b6}.notice.success{background:#e8f8f1;color:#137b54}.notice.error{background:#fff0f1;color:#c43c49}.step-card{text-align:center;max-width:520px;margin:10px auto;padding:25px}.step-card .avatar{width:90px;height:90px;border-radius:24px;font-size:28px;margin:0 auto 14px}.step-card h2{font-size:20px;margin:7px 0}.step-actions{display:flex;gap:12px;margin-top:20px}.step-actions button{flex:1;padding:14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:460px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:12px}th{color:#8b98ad;font-size:10px;text-transform:uppercase;letter-spacing:.6px}td{font-weight:600}.empty{text-align:center;color:var(--muted);padding:35px 10px;font-size:13px}.modal-backdrop{position:fixed;inset:0;background:#101a2e80;display:grid;place-items:center;padding:16px;z-index:30}.modal{background:#fff;width:min(100%,430px);padding:22px;border-radius:18px;box-shadow:0 20px 70px #0003}.modal h3{margin:0 0 17px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#dce8ff,transparent 40%),#f4f7fc}.login-card{width:min(100%,420px);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 18px 55px #243f7415}.login-card .brand{justify-content:center;margin-bottom:25px}.login-card h1{text-align:center;font-size:23px;margin:0 0 7px}.login-card .sub{text-align:center;margin-bottom:25px}.login-links{text-align:center;margin-top:17px;font-size:12px;color:var(--muted)}.link{color:var(--primary);font-weight:800;background:none;padding:4px}.mobile-menu{display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#17233c;color:#fff;padding:12px 17px;border-radius:12px;font-size:12px;z-index:50;box-shadow:var(--shadow);max-width:90%;text-align:center}.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{border-radius:9px;padding:9px 2px;text-align:center;font-size:11px;background:#f2f5fa}.day b{display:block;font-size:10px;margin-bottom:5px;color:#66748d}.day.present{background:#e5f7ef;color:#118256}.day.absent{background:#fff0f1;color:#d04450}.day.none{background:#f1f3f7;color:#9aa6ba}.checkline{display:flex;align-items:center;gap:8px;font-size:12px;color:#56647b}.checkline input{width:auto}.footer-note{font-size:10px;color:#9aa6ba;text-align:center;margin-top:25px}
@media(max-width:800px){.topbar{height:60px;padding:0 14px}.layout{display:block}.sidebar{display:none;position:fixed;z-index:20;top:60px;bottom:0;left:0;width:270px;background:#fff;box-shadow:10px 0 30px #14264a20;overflow:auto}.sidebar.open{display:block}.mobile-menu{display:inline-grid}.main{padding:20px 14px 35px}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px}.stat .value{font-size:22px}.page-head h1{font-size:21px}.two-col{grid-template-columns:1fr}.student-row{gap:9px;padding:10px}.row-actions .mini{padding:8px}.row-actions{gap:5px}.details{grid-template-columns:1fr 1fr}.top-right .class-pill{font-size:10px;padding:7px 9px}}
@media(max-width:390px){.row-actions .call-text{display:none}.details{grid-template-columns:1fr}.main{padding-left:11px;padding-right:11px}.student-info strong{font-size:12px}}
</style>
</head>
<body>
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="brand"><div class="brand-mark">✦</div><span>EduManage</span></div>
    <h1>Welcome Back</h1><p class="sub">Sign in to your class account</p>
    <div id="loginNotice"></div>
    <div class="field"><label>Select Class</label><select id="loginClass"></select></div>
    <div class="field"><label>Password</label><input class="input" id="loginPassword" type="password" placeholder="Enter class password"></div>
    <button class="btn btn-primary" style="width:100%;padding:13px" onclick="login()">Login to Dashboard →</button>
    <div class="login-links">Need access to a class? <button class="link" onclick="showRequest()">Request an account</button></div>
    <div class="footer-note">DEMO PROJECT · Default password: <b>1234</b></div>
  </div>
</div>

<div id="requestView" class="login-wrap hidden">
 <div class="login-card">
  <div class="brand"><div class="brand-mark">✦</div><span>EduManage</span></div>
  <h1>Request Account Access</h1><p class="sub">Choose the class you want to manage</p>
  <div class="field"><label>Select Class</label><select id="requestClass"></select></div>
  <div class="field"><label>Your name (optional)</label><input class="input" id="requestName" placeholder="Enter your name"></div>
  <button class="btn btn-primary" style="width:100%" onclick="submitRequest()">Submit Request</button>
  <div class="login-links"><button class="link" onclick="showLogin()">← Back to login</button></div>
 </div>
</div>

<div id="appView" class="app hidden">
 <header class="topbar">
  <div class="brand"><button class="icon-btn mobile-menu" onclick="toggleSidebar()">☰</button><div class="brand-mark">✦</div><span>EduManage</span></div>
  <div class="top-right"><span id="topClass" class="class-pill">CLASS 1</span><button class="icon-btn" title="Logout" onclick="logout()">⇥</button></div>
 </header>
 <div class="layout">
  <aside class="sidebar" id="sidebar">
   <div class="side-label">MAIN MENU</div>
   <button class="nav-btn active" data-page="home" onclick="navigate('home')"><span>▦</span>Dashboard</button>
   <button class="nav-btn" data-page="attendance" onclick="navigate('attendance')"><span>☑</span>Take Attendance</button>
   <button class="nav-btn" data-page="attendanceReport" onclick="navigate('attendanceReport')"><span>▤</span>Attendance Report</button>
   <div class="side-label">COMMUNICATION</div>
   <button class="nav-btn" data-page="notification" onclick="navigate('notification')"><span>♢</span>Send Notification</button>
   <button class="nav-btn" data-page="studentReport" onclick="navigate('studentReport')"><span>⚑</span>Student Report</button>
   <div class="side-label">ACADEMIC & FEES</div>
   <button class="nav-btn" data-page="results" onclick="navigate('results')"><span>▧</span>Exam Results</button>
   <button class="nav-btn" data-page="fees" onclick="navigate('fees')"><span>৳</span>Examination Fees</button>
   <div class="side-label">ACCOUNT</div>
   <button class="nav-btn" onclick="logout()"><span>⇥</span>Logout</button>
  </aside>
  <main class="main" id="main"></main>
 </div>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const CLASSES=Array.from({length:10},(_,i)=>`Class ${i+1}`);
const seedStudents=[
 {id:"ST-1001",name:"Ayesha Rahman",roll:"01",phone:"01711000001",father:"Abdul Rahman",mother:"Nasima Begum",dob:"2013-04-12",class:"Class 1"},
 {id:"ST-1002",name:"Mohammad Hasan",roll:"02",phone:"01711000002",father:"Mohammad Ali",mother:"Fatema Khatun",dob:"2013-08-21",class:"Class 1"},
 {id:"ST-1003",name:"Sadia Islam",roll:"03",phone:"01711000003",father:"Jamal Uddin",mother:"Rokeya Begum",dob:"2013-02-05",class:"Class 1"},
 {id:"ST-1004",name:"Abdullah Karim",roll:"04",phone:"01711000004",father:"Karim Uddin",mother:"Shahana Akter",dob:"2013-11-18",class:"Class 1"},
 {id:"ST-1005",name:"Mariam Akter",roll:"05",phone:"01711000005",father:"Nur Islam",mother:"Momena Begum",dob:"2013-06-30",class:"Class 1"},
 {id:"ST-2001",name:"Tanvir Ahmed",roll:"01",phone:"01712000001",father:"Abu Taher",mother:"Shirin Akter",dob:"2012-03-15",class:"Class 2"},
 {id:"ST-2002",name:"Sumaiya Khan",roll:"02",phone:"01712000002",father:"Mizanur Rahman",mother:"Salma Begum",dob:"2012-09-09",class:"Class 2"},
 {id:"ST-2003",name:"Rakib Hossain",roll:"03",phone:"01712000003",father:"Shahid Hossain",mother:"Parvin Akter",dob:"2012-01-27",class:"Class 2"},
 {id:"ST-3001",name:"Nusrat Jahan",roll:"01",phone:"01713000001",father:"Abdul Kader",mother:"Amina Begum",dob:"2011-05-11",class:"Class 3"},
 {id:"ST-3002",name:"Sakib Mahmud",roll:"02",phone:"01713000002",father:"Mahmudul Hasan",mother:"Lovely Akter",dob:"2011-12-03",class:"Class 3"}
];
const today=()=>new Date().toISOString().slice(0,10);
const dateLabel=(d)=>new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
let db=loadDB(),currentClass="Class 1",page="home",attendanceQueue=[],attendanceIndex=0,attendanceDraft={},selectedStudent=null;
function loadDB(){try{const saved=JSON.parse(localStorage.getItem("edumanage_demo"));if(saved)return saved}catch(e){}return {students:seedStudents,attendance:{},requests:[],notifications:[],reports:[],fees:{},results:{}}}
function saveDB(){localStorage.setItem("edumanage_demo",JSON.stringify(db))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function initials(n){return (n||"?").split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase()}
function avatar(s,size=""){return `<div class="avatar ${size}">${s.photo?`<img src="${esc(s.photo)}">`:initials(s.name)}</div>`}
function students(){return db.students.filter(s=>s.class===currentClass)}
function fillClassSelects(){["loginClass","requestClass"].forEach(id=>document.getElementById(id).innerHTML=CLASSES.map(c=>`<option>${c}</option>`).join(""))}
fillClassSelects();
function showLogin(){document.getElementById("loginView").classList.remove("hidden");document.getElementById("requestView").classList.add("hidden");document.getElementById("appView").classList.add("hidden")}
function showRequest(){document.getElementById("loginView").classList.add("hidden");document.getElementById("requestView").classList.remove("hidden")}
function login(){const c=document.getElementById("loginClass").value,p=document.getElementById("loginPassword").value;if(p!=="1234"){document.getElementById("loginNotice").innerHTML='<div class="notice error">Incorrect password. For this demo, use 1234.</div>';return}currentClass=c;document.getElementById("loginView").classList.add("hidden");document.getElementById("requestView").classList.add("hidden");document.getElementById("appView").classList.remove("hidden");document.getElementById("topClass").textContent=c.toUpperCase();navigate("home")}
function logout(){showLogin();document.getElementById("loginPassword").value=""}
function submitRequest(){const c=document.getElementById("requestClass").value,n=document.getElementById("requestName").value.trim();db.requests.push({class:c,name:n,date:new Date().toISOString(),status:"Pending"});saveDB();toast("Demo request submitted for "+c);showLogin()}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open")}
function navigate(p){page=p;document.querySelectorAll(".nav-btn[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));document.getElementById("sidebar").classList.remove("open");render()}
function head(title,sub,action=""){return `<div class="page-head"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function render(){const m=document.getElementById("main");({home:renderHome,profile:renderProfile,attendance:renderAttendance,attendanceReport:renderAttendanceReport,notification:renderNotification,studentReport:renderStudentReport,fees:renderFees,results:renderResults})[page]?.()}
function renderHome(){const list=students();document.getElementById("main").innerHTML=head("Class Dashboard",`Manage students and daily activities for ${currentClass}.`)+
`<div class="stats"><div class="stat"><div class="label">Total Students</div><div class="value">${list.length}</div><div class="hint">In ${currentClass}</div></div><div class="stat"><div class="label">Present Today</div><div class="value">${Object.values(db.attendance[today()]||{}).filter(x=>list.some(s=>s.id===x.id)&&x.status==="Present").length}</div><div class="hint">Attendance recorded</div></div><div class="stat"><div class="label">Absent Today</div><div class="value">${Object.values(db.attendance[today()]||{}).filter(x=>list.some(s=>s.id===x.id)&&x.status==="Absent").length}</div><div class="hint">Attendance recorded</div></div><div class="stat"><div class="label">Fee Paid</div><div class="value">${list.filter(s=>db.fees[s.id]?.paid).length}</div><div class="hint">Examination fees</div></div></div>
<div class="panel"><div class="toolbar" style="justify-content:space-between"><div><b style="font-size:15px">Student Directory</b><div class="sub" style="margin-top:4px">Select a student to view their profile</div></div><input class="input search" id="studentSearch" placeholder="Search by name, ID or roll..." oninput="filterStudents()"></div><div id="studentList" class="student-list">${studentRows(list)}</div></div>`}
function studentRows(list){if(!list.length)return '<div class="empty">No students found in this class.</div>';return list.map(s=>`<div class="student-row">${avatar(s)}<div class="student-info"><strong>${esc(s.name)}</strong><small>Roll: ${esc(s.roll)} · ${esc(s.id)} · ${esc(s.phone)}</small></div><div class="row-actions"><a class="mini btn-soft" href="tel:${esc(s.phone)}">☎ <span class="call-text">Call</span></a><button class="mini btn-outline" onclick="openProfile('${s.id}')">View</button></div></div>`).join("")}
function filterStudents(){const q=document.getElementById("studentSearch").value.toLowerCase();document.getElementById("studentList").innerHTML=studentRows(students().filter(s=>[s.name,s.id,s.roll,s.phone].some(v=>String(v).toLowerCase().includes(q))))}
function openProfile(id){selectedStudent=db.students.find(s=>s.id===id);page="profile";render()}
function renderProfile(){const s=selectedStudent;if(!s){navigate("home");return}document.getElementById("main").innerHTML=head("Student Profile","Student information and class management.",'<button class="btn btn-outline" onclick="navigate(\'home\')">← Back</button>')+`<div class="panel form-card"><div class="profile-top">${avatar(s)}<div><h2 style="margin:0 0 5px">${esc(s.name)}</h2><span class="badge" style="background:#edf3ff;color:var(--primary)">${esc(s.class)}</span></div></div><div class="details">${detail("Student ID",s.id)}${detail("Phone Number",s.phone)}${detail("Roll Number",s.roll)}${detail("Father's Name",s.father)}${detail("Mother's Name",s.mother)}${detail("Date of Birth",s.dob)}</div><div class="field" style="margin-top:20px"><label>Change Student Class</label><select id="newStudentClass">${CLASSES.map(c=>`<option ${c===s.class?"selected":""}>${c}</option>`).join("")}</select></div><button class="btn btn-primary" onclick="changeStudentClass('${s.id}')">Update Class</button><div class="notice info">Changing the class moves this student to the selected class list in this demo project.</div></div>`}
function detail(k,v){return `<div class="detail"><small>${k}</small><strong>${esc(v||"Not provided")}</strong></div>`}
function changeStudentClass(id){const s=db.students.find(x=>x.id===id),c=document.getElementById("newStudentClass").value;if(c===s.class){toast("Student is already in "+c);return}if(confirm(`Move ${s.name} to ${c}?`)){s.class=c;saveDB();toast("Student class updated");navigate("home")}}
function renderAttendance(){const done=Object.keys(db.attendance[today()]||{}).length;document.getElementById("main").innerHTML=head("Take Attendance","Record daily attendance one student at a time.")+`<div class="panel" style="margin-bottom:15px"><div class="two-col"><div><div class="sub">TODAY'S DATE</div><h2 style="margin:6px 0 0">${dateLabel(today())}</h2></div><div><div class="sub">CURRENT CLASS</div><h2 style="margin:6px 0 0">${currentClass}</h2></div></div><div class="notice info">Attendance already recorded today: ${done} student(s). Starting again will let you review and update today's statuses.</div><button class="btn btn-primary" onclick="startAttendance()">▶ Start Attendance</button></div><div class="panel"><b>Today's attendance summary</b><div id="todaySummary" style="margin-top:12px">${dailySummary()}</div></div>`}
function startAttendance(){attendanceQueue=students();attendanceIndex=0;attendanceDraft={...(db.attendance[today()]||{})};if(!attendanceQueue.length){toast("There are no students in this class.");return}showAttendanceStep()}
function showAttendanceStep(){const m=document.getElementById("main");if(attendanceIndex>=attendanceQueue.length){Object.assign(db.attendance[today()]||(db.attendance[today()]={}),attendanceDraft);saveDB();renderAttendanceComplete();return}const s=attendanceQueue[attendanceIndex];m.innerHTML=head("Taking Attendance",`${dateLabel(today())} · ${currentClass}`)+`<div class="panel step-card">${avatar(s)}<div class="sub">STUDENT ${attendanceIndex+1} OF ${attendanceQueue.length}</div><h2>${esc(s.name)}</h2><p class="sub">Roll No. ${esc(s.roll)} · ID: ${esc(s.id)}</p><div class="step-actions"><button class="btn btn-success" onclick="markAttendance('Present')">✓ Present</button><button class="btn btn-danger" onclick="markAttendance('Absent')">✕ Absent</button></div><div style="margin-top:15px"><button class="btn btn-outline" onclick="navigate('attendance')">Cancel</button></div></div>`}
function markAttendance(status){const s=attendanceQueue[attendanceIndex];attendanceDraft[s.id]={id:s.id,name:s.name,roll:s.roll,status,date:today()};attendanceIndex++;showAttendanceStep()}
function renderAttendanceComplete(){const m=document.getElementById("main");const rows=students().map(s=>{const r=attendanceDraft[s.id];return `<tr><td>${esc(s.name)}</td><td>${esc(s.roll)}</td><td><span class="badge ${r?.status==="Present"?"present":"absent"}">${r?.status==="Present"?"✓ Present":"✕ Absent"}</span></td></tr>`}).join("");const p=students().filter(s=>attendanceDraft[s.id]?.status==="Present").length,a=students().length-p;m.innerHTML=head("Daily Attendance Report",`${dateLabel(today())} · ${currentClass}`)+`<div class="stats"><div class="stat"><div class="label">Total Students</div><div class="value">${students().length}</div></div><div class="stat"><div class="label">Present</div><div class="value" style="color:var(--green)">${p}</div></div><div class="stat"><div class="label">Absent</div><div class="value" style="color:var(--red)">${a}</div></div><div class="stat"><div class="label">Attendance</div><div class="value">${students().length?Math.round(p/students().length*100):0}%</div></div></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Student</th><th>Roll</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div><div style="margin-top:16px"><button class="btn btn-primary" onclick="navigate('attendance')">Done</button></div></div>`}
function dailySummary(){const rec=db.attendance[today()]||{},list=students(),p=list.filter(s=>rec[s.id]?.status==="Present").length,a=list.filter(s=>rec[s.id]?.status==="Absent").length;return `<div class="toolbar"><span class="badge present">✓ Present: ${p}</span><span class="badge absent">✕ Absent: ${a}</span><span class="badge pending">Not marked: ${list.length-p-a}</span></div>`}
function renderAttendanceReport(){document.getElementById("main").innerHTML=head("Student Attendance Report","Review a student's attendance for any month.")+`<div class="panel form-card"><div class="field"><label>Select Student</label><select id="reportStudent">${students().map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.roll)}</option>`).join("")}</select></div><div class="field"><label>Select Month</label><input class="input" id="reportMonth" type="month" value="${today().slice(0,7)}"></div><button class="btn btn-primary" onclick="showMonthlyReport()">View Monthly Report</button></div><div id="monthlyResult"></div>`}
function showMonthlyReport(){const id=document.getElementById("reportStudent").value,month=document.getElementById("reportMonth").value;if(!id||!month){toast("Select a student and month.");return}const s=db.students.find(x=>x.id===id),[y,mo]=month.split("-").map(Number),days=new Date(y,mo,0).getDate();let p=0,a=0,un=0,cells="";for(let d=1;d<=days;d++){const key=`${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`,r=db.attendance[key]?.[id],status=r?.status;if(status==="Present")p++;else if(status==="Absent")a++;else un++;cells+=`<div class="day ${status==="Present"?"present":status==="Absent"?"absent":"none"}"><b>${d}</b>${status==="Present"?"✓":status==="Absent"?"✕":"—"}</div>`}document.getElementById("monthlyResult").innerHTML=`<div class="panel" style="margin-top:16px"><h3 style="margin:0 0 5px">${esc(s.name)}</h3><p class="sub">${month} · ${days} calendar days</p><div class="month-grid" style="margin-top:17px">${cells}</div><div class="stats" style="margin-top:17px"><div class="stat"><div class="label">Present</div><div class="value" style="color:var(--green)">${p}</div></div><div class="stat"><div class="label">Absent</div><div class="value" style="color:var(--red)">${a}</div></div><div class="stat"><div class="label">Unrecorded</div><div class="value">${un}</div></div><div class="stat"><div class="label">Attendance</div><div class="value">${days?Math.round(p/days*100):0}%</div></div></div></div>`}
function studentOptions(){return students().map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.roll)}</option>`).join("")}
function renderNotification(){document.getElementById("main").innerHTML=head("Send Notification","Compose a message for selected students.")+`<div class="panel form-card"><div class="field"><label>Notification Title</label><input class="input" id="notifTitle" placeholder="Enter notification title"></div><div class="field"><label>Message</label><textarea id="notifMessage" placeholder="Write your notification..."></textarea></div><div class="field"><label>Recipients</label><label class="checkline"><input type="checkbox" id="selectAllNotif" onchange="toggleAll('notifStudents',this.checked)"> Select all students in ${currentClass}</label><div id="notifStudents" style="display:grid;gap:9px;margin-top:8px">${students().map(s=>`<label class="checkline"><input type="checkbox" value="${s.id}"> ${esc(s.name)}</label>`).join("")}</div></div><button class="btn btn-primary" onclick="sendNotification()">Send Notification</button><div class="notice info">Demo mode: messages are saved in this browser only. No push notification is sent to a real device.</div></div><div id="notificationHistory" style="margin-top:16px">${notificationHistory()}</div>`}
function toggleAll(id,on){document.querySelectorAll(`#${id} input[type=checkbox]`).forEach(x=>x.checked=on)}
function sendNotification(){const title=document.getElementById("notifTitle").value.trim(),message=document.getElementById("notifMessage").value.trim(),ids=[...document.querySelectorAll("#notifStudents input:checked")].map(x=>x.value);if(!title||!message||!ids.length){toast("Enter a title, message and select at least one student.");return}db.notifications.unshift({title,message,ids,class:currentClass,date:new Date().toISOString()});saveDB();toast("Demo notification saved successfully.");renderNotification()}
function notificationHistory(){const items=db.notifications.filter(n=>n.class===currentClass);return `<div class="panel"><b>Recent Notifications</b>${items.length?items.slice(0,5).map(n=>`<div class="detail" style="margin-top:10px"><strong>${esc(n.title)}</strong><div class="sub" style="margin-top:5px">${esc(n.message)}</div><small style="display:block;margin-top:7px;color:var(--muted)">${n.ids.length} recipient(s) · ${new Date(n.date).toLocaleString()}</small></div>`).join(""):'<div class="empty">No notifications sent yet.</div>'}</div>`}
function renderStudentReport(){document.getElementById("main").innerHTML=head("Student Report","Send a report about a selected student.")+`<div class="panel form-card"><div class="field"><label>Select Student</label><select id="srStudent">${studentOptions()}</select></div><div class="field"><label>Report Title</label><input class="input" id="srTitle" placeholder="e.g. Monthly performance"></div><div class="field"><label>Report Message</label><textarea id="srMessage" placeholder="Write report details..."></textarea></div><button class="btn btn-primary" onclick="sendStudentReport()">Submit Report</button></div><div id="reportHistory" style="margin-top:16px">${studentReportHistory()}</div>`}
function sendStudentReport(){const id=document.getElementById("srStudent").value,title=document.getElementById("srTitle").value.trim(),message=document.getElementById("srMessage").value.trim();if(!id||!title||!message){toast("Please complete all fields.");return}const s=db.students.find(x=>x.id===id);db.reports.unshift({id,name:s.name,title,message,class:currentClass,date:new Date().toISOString()});saveDB();toast("Student report saved.");renderStudentReport()}
function studentReportHistory(){const items=db.reports.filter(r=>r.class===currentClass);return `<div class="panel"><b>Submitted Reports</b>${items.length?items.slice(0,6).map(r=>`<div class="detail" style="margin-top:10px"><strong>${esc(r.title)} · ${esc(r.name)}</strong><div class="sub" style="margin-top:5px">${esc(r.message)}</div><small style="display:block;margin-top:7px;color:var(--muted)">${new Date(r.date).toLocaleString()}</small></div>`).join(""):'<div class="empty">No reports submitted yet.</div>'}</div>`}
function renderFees(){const list=students();document.getElementById("main").innerHTML=head("Examination Fee List","Track examination fee payments for "+currentClass)+`<div class="stats"><div class="stat"><div class="label">Total Students</div><div class="value">${list.length}</div></div><div class="stat"><div class="label">Paid</div><div class="value" style="color:var(--green)">${list.filter(s=>db.fees[s.id]?.paid).length}</div></div><div class="stat"><div class="label">Unpaid</div><div class="value" style="color:var(--red)">${list.filter(s=>!db.fees[s.id]?.paid).length}</div></div><div class="stat"><div class="label">Collected</div><div class="value">৳${list.reduce((a,s)=>a+(db.fees[s.id]?.amount||0),0)}</div></div></div><div class="panel"><div class="student-list">${list.length?list.map(s=>{const f=db.fees[s.id];return `<div class="student-row">${avatar(s)}<div class="student-info"><strong>${esc(s.name)}</strong><small>Roll: ${esc(s.roll)} · ${esc(s.id)}${f?.paid?` · Paid ৳${f.amount}`:""}</small></div>${f?.paid?'<span class="badge paid">✓ PAID</span>':`<button class="mini btn-primary" onclick="openFeeModal('${s.id}')">Pay Now</button>`}</div>`}).join(""):'<div class="empty">No students in this class.</div>'}</div></div><div id="feeHistory" style="margin-top:16px">${feeHistory()}</div>`}
function openFeeModal(id){const s=db.students.find(x=>x.id===id);document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>Record Examination Fee</h3><p class="sub" style="margin-bottom:17px">${esc(s.name)} · ${esc(s.id)}</p><div class="field"><label>Amount Received (৳)</label><input class="input" id="feeAmount" type="number" min="1" placeholder="Enter amount"></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveFee('${id}')">Done</button></div></div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function saveFee(id){const amount=Number(document.getElementById("feeAmount").value);if(!Number.isFinite(amount)||amount<=0){toast("Enter a valid amount.");return}db.fees[id]={paid:true,amount,date:new Date().toISOString(),class:currentClass};saveDB();closeModal();toast("Payment recorded successfully.");renderFees()}
function feeHistory(){const paid=students().filter(s=>db.fees[s.id]?.paid);return `<div class="panel"><b>Payment History</b>${paid.length?paid.map(s=>`<div class="detail" style="margin-top:9px;display:flex;justify-content:space-between;gap:10px"><div><strong>${esc(s.name)}</strong><small style="display:block;color:var(--muted);margin-top:4px">${new Date(db.fees[s.id].date).toLocaleString()}</small></div><strong style="color:var(--green)">৳${db.fees[s.id].amount}</strong></div>`).join(""):'<div class="empty">No payments recorded yet.</div>'}</div>`}
function renderResults(){const list=students();document.getElementById("main").innerHTML=head("Examination Results","Demo result overview for students in "+currentClass)+`<div class="panel"><div class="notice info">This test project includes sample result data for demonstration. A result entry and editing workflow can be added later.</div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Roll</th><th>Exam</th><th>Marks</th><th>Grade</th></tr></thead><tbody>${list.map((s,i)=>{const marks=[86,78,92,65,73,81,88,69,95,76][i%10];return `<tr><td>${esc(s.name)}</td><td>${esc(s.roll)}</td><td>Annual Exam</td><td>${marks}/100</td><td><span class="badge ${marks>=80?"paid":marks>=60?"pending":"absent"}">${marks>=80?"A":marks>=70?"B":marks>=60?"C":"D"}</span></td></tr>`}).join("")}</tbody></table></div></div>`}
function toast(msg){const root=document.getElementById("toastRoot");root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML="",2600)}
</script>
</body>
</html>
